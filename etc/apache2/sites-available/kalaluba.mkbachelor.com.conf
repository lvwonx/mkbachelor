<VirtualHost *:80>
    ServerName kalaluba.mkbachelor.com
    ServerAlias www.kalaluba.mkbachelor.com

    DocumentRoot /var/www/kalaluba.mkbachelor.com

    <Directory /var/www/kalaluba.mkbachelor.com>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sub_error.log
    CustomLog ${APACHE_LOG_DIR}/sub_access.log combined
</VirtualHost>
