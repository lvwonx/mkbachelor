Alias /phpmyadmin /usr/share/phpmyadmin

<VirtualHost *:80>
    ServerAdmin admin@mkbachelor.com
    ServerName mkbachelor.com
    ServerAlias www.mkbachelor.com
    DocumentRoot /var/www/mkbachelor.com
    ErrorLog ${APACHE_LOG_DIR}/mkbachelor.com.error.log
    CustomLog ${APACHE_LOG_DIR}/mkbachelor.com.access.log combined
    WSGIDaemonProcess mkbachelor python-home=/var/www/mkbachelor.com/venv python-path=/var/www/mkbachelor.com
    WSGIProcessGroup mkbachelor
    WSGIScriptAlias / /var/www/mkbachelor.com/app.wsgi
    Alias /static/ /var/www/mkbachelor.com/static/
    <Directory /var/www/mkbachelor.com/static/>
	Require all granted
    </Directory>
    <Directory /var/www/mkbachelor.com>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
</VirtualHost>
